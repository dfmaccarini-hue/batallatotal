<!DOCTYPE html>
<html>
<head>
    <title>Pago de Puja</title>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .option {
            border: 1px solid #ccc;
            padding: 20px;
            width: 40%;
            text-align: center;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        h2 {
            text-align: center;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #005fa3;
        }
        img {
            max-width: 200px;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
    </style>
    <script>
        function disableBtn(btn) {
            btn.disabled = true;
            btn.innerText = "Redirigiendo...";
        }
    </script>
</head>
<body>
    <h2>Pagar puja de {{ amount }} ARS</h2>

    <div class="container">
        <div class="option">
            <h3>Opción 1: Link de pago</h3>
            <p>Podés pagar directamente en Mercado Pago:</p>
            <!-- Botón que abre en la misma pestaña y se desactiva al clic -->
            <button onclick="disableBtn(this); window.location.href='{{ payment_url }}'">
                Ir a Mercado Pago
            </button>
        </div>

        {% if qr_base64 %}
        <div class="option">
            <h3>Opción 2: QR de pago</h3>
            <p>Escaneá este QR con la app de Mercado Pago:</p>
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR de pago">
        </div>
        {% endif %}
    </div>
</body>
</html>
