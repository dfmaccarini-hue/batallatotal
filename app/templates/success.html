<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago exitoso</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-lg border-success">
            <div class="card-header bg-success text-white text-center">
                <h2>✅ ¡Pago aprobado!</h2>
            </div>
            <div class="card-body">
                {% if project %}
                    <h4 class="card-title">Proyecto: {{ project.name }}</h4>
                    <p class="card-text">
                        <strong>Categoría:</strong> {{ project.category }} <br>
                        <strong>Descripción:</strong> {{ project.description }}
                    </p>
                {% endif %}
                {% if bid %}
                    <p class="card-text fs-5">
                        La puja aprobada fue de <span class="fw-bold text-success">${{ bid.amount }}</span>.
                    </p>
                {% endif %}
                <div class="text-center mt-4">
                    <a href="{{ url_for('leaderboard.index') }}" class="btn btn-outline-success btn-lg">
                        Volver al leaderboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
